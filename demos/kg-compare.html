<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disease Comparison</title>

  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <link  href="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.css" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F8F7F5;
      --surface:      #FFFFFF;
      --border:       #E5E3DC;
      --border-light: #F0EFE8;
      --text:         #1A1A18;
      --text-sec:     #5F5E5A;
      --text-ter:     #9B9A96;
      --accent:       #2B55CC;
      --canvas-bg:    #FAFAF8;

      /* Disease A: coral */
      --dis-a-bg:     #FAECE7;
      --dis-a-border: #993C1D;
      --dis-a-font:   #4A1B0C;
      --dis-a-mid:    #D85A30;

      /* Disease B: indigo */
      --dis-b-bg:     #EDF2FF;
      --dis-b-border: #2B55CC;
      --dis-b-font:   #162B66;
      --dis-b-mid:    #4070EE;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    button, input { font-family: inherit; font-size: 13px; }

    /* ── Header ────────────────────────────────────────────────────── */
    #app-header {
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      flex-shrink: 0;
    }

    #app-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    #header-divider { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }

    /* Disease name pills in the header */
    .dis-pill {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 4px;
      white-space: nowrap;
      border: 1px solid;
    }

    .dis-pill-a {
      background: var(--dis-a-bg);
      border-color: var(--dis-a-border);
      color: var(--dis-a-font);
    }

    .dis-pill-b {
      background: var(--dis-b-bg);
      border-color: var(--dis-b-border);
      color: var(--dis-b-font);
    }

    #header-vs {
      font-size: 11px;
      color: var(--text-ter);
      flex-shrink: 0;
    }

    #header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .action-btn {
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text-sec);
      cursor: pointer;
    }
    .action-btn:hover { background: var(--border-light); color: var(--text); }

    /* ── Summary strip (below header, above canvas) ─────────────────── */
    #summary-strip {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    #summary-text {
      font-size: 12px;
      color: var(--text-sec);
      flex: 1;
      line-height: 1.4;
    }

    /* Shared count badges — clickable to highlight those entities */
    .shared-badge {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--border-light);
      color: var(--text-sec);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .shared-badge:hover { background: var(--border); color: var(--text); }
    .shared-badge.active { background: #EEEDFE; border-color: #534AB7; color: #26215C; }

    /* ── App body ───────────────────────────────────────────────────── */
    #app-body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    #sidebar {
      width: 268px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-ter);
      margin-bottom: 10px;
    }

    /* Disease cards in sidebar */
    .disease-card {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid;
    }

    .disease-card:last-child { margin-bottom: 0; }

    .disease-card-a {
      background: var(--dis-a-bg);
      border-color: #F0C0AE;
    }

    .disease-card-b {
      background: var(--dis-b-bg);
      border-color: #B8CBF8;
    }

    .disease-card-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .disease-card-a .disease-card-name { color: var(--dis-a-font); }
    .disease-card-b .disease-card-name { color: var(--dis-b-font); }

    .disease-card-id {
      font-size: 10px;
      font-family: monospace;
      color: var(--text-ter);
      margin-bottom: 6px;
    }

    .disease-card-counts {
      font-size: 11px;
      color: var(--text-sec);
    }

    /* Shared entity counts — clickable */
    .shared-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
    }

    .shared-row:last-child { border-bottom: none; }
    .shared-row:hover { background: var(--border-light); margin: 0 -16px; padding: 6px 16px; }

    .shared-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-sec);
    }

    .shared-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .shared-row-count {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    /* Filter rows */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }
    .filter-row:last-child { margin-bottom: 0; }

    .filter-row input[type="checkbox"] { width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }
    .filter-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .filter-name   { flex: 1; font-size: 12px; color: var(--text-sec); }
    .filter-count  { font-size: 11px; color: var(--text-ter); }

    /* Search */
    #search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      color: var(--text);
      background: var(--canvas-bg);
      outline: none;
    }
    #search-input:focus { border-color: #B4B2A9; }
    #search-input::placeholder { color: var(--text-ter); }
    #search-hint { font-size: 11px; color: var(--text-ter); margin-top: 5px; }

    .ctrl-btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--canvas-bg);
      color: var(--text-sec);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }
    .ctrl-btn:hover { background: var(--border-light); }

    /* ── Legend ─────────────────────────────────────────────────────── */
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-sec);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid;
    }

    .legend-line {
      width: 22px;
      height: 2px;
      flex-shrink: 0;
      border-radius: 1px;
    }

    /* ── Canvas ─────────────────────────────────────────────────────── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--canvas-bg);
    }

    #graph-canvas { width: 100%; height: 100%; }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(250,250,248,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 50;
    }

    #loading-label { font-size: 13px; color: var(--text-sec); }

    #loading-bar-wrap {
      width: 180px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: #534AB7;
      border-radius: 2px;
      transition: width 0.1s;
    }

    /* ── Details panel ───────────────────────────────────────────────── */
    #details-panel {
      width: 288px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      transition: width 0.2s ease, border-left-width 0.2s ease;
    }

    #details-panel.closed { width: 0; border-left-width: 0; overflow: hidden; }
    #details-panel::-webkit-scrollbar { width: 4px; }
    #details-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #details-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 0;
    }

    #details-header-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-ter);
    }

    #close-btn {
      font-size: 11px;
      color: var(--text-ter);
      cursor: pointer;
      background: none;
      border: none;
    }
    #close-btn:hover { color: var(--text); }

    #details-body { padding: 12px 16px 20px; }

    .detail-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .detail-node-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .detail-node-id {
      font-size: 10px;
      font-family: monospace;
      color: var(--text-ter);
      margin-bottom: 10px;
    }

    .detail-description {
      font-size: 12px;
      color: var(--text-sec);
      line-height: 1.6;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-light);
    }

    .detail-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-ter);
      margin: 14px 0 8px;
    }

    /*
     * Comparison table — shown for shared entities.
     * Displays the relationship each disease has to the selected entity.
     */
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
    }

    .compare-table th {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-ter);
      text-align: left;
      padding: 0 0 6px;
      border-bottom: 1px solid var(--border-light);
    }

    .compare-table td {
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    .compare-table tr:last-child td { border-bottom: none; }

    .compare-table td:first-child { color: var(--text-ter); padding-right: 8px; width: 38%; }
    .compare-table td:last-child  { color: var(--text-sec); }

    .props-table { width: 100%; border-collapse: collapse; }
    .props-table tr { border-bottom: 1px solid var(--border-light); }
    .props-table tr:last-child { border-bottom: none; }
    .props-table td { padding: 5px 0; font-size: 12px; vertical-align: top; }
    .prop-key { color: var(--text-ter); padding-right: 10px; width: 42%; }
    .prop-val { color: var(--text-sec); word-break: break-word; }

    .detail-external-link {
      display: block;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
    }
    .detail-external-link:hover { text-decoration: underline; }
  </style>
</head>

<body>

  <!-- ── Header ───────────────────────────────────────────────────── -->
  <header id="app-header">
    <span id="app-title">Knowledge Graph Explorer</span>
    <div id="header-divider"></div>
    <span class="dis-pill dis-pill-a" id="header-name-a">...</span>
    <span id="header-vs">vs</span>
    <span class="dis-pill dis-pill-b" id="header-name-b">...</span>
    <div id="header-actions">
      <button class="action-btn" onclick="resetView()">Fit to screen</button>
      <button class="action-btn" onclick="exportPNG()">Export PNG</button>
    </div>
  </header>

  <!-- ── Summary strip ─────────────────────────────────────────────── -->
  <div id="summary-strip">
    <p id="summary-text">Loading...</p>
    <div id="shared-badges"></div>
  </div>

  <!-- ── App body ──────────────────────────────────────────────────── -->
  <div id="app-body">

    <aside id="sidebar">

      <!-- Disease cards -->
      <div class="sidebar-section">
        <div class="section-label">Diseases compared</div>
        <div class="disease-card disease-card-a">
          <div class="disease-card-name" id="card-name-a"></div>
          <div class="disease-card-id"   id="card-id-a"></div>
          <div class="disease-card-counts" id="card-counts-a"></div>
        </div>
        <div class="disease-card disease-card-b">
          <div class="disease-card-name" id="card-name-b"></div>
          <div class="disease-card-id"   id="card-id-b"></div>
          <div class="disease-card-counts" id="card-counts-b"></div>
        </div>
      </div>

      <!-- Shared entity counts — clickable to highlight -->
      <div class="sidebar-section">
        <div class="section-label">Shared connections</div>
        <div id="shared-list"></div>
      </div>

      <!-- Visibility filters -->
      <div class="sidebar-section">
        <div class="section-label">Show / hide</div>
        <div id="status-filter-list"></div>
      </div>

      <!-- Node type filters -->
      <div class="sidebar-section">
        <div class="section-label">Node types</div>
        <div id="type-filter-list"></div>
      </div>

      <!-- Relationship filters -->
      <div class="sidebar-section">
        <div class="section-label">Relationships</div>
        <div id="relation-filter-list"></div>
      </div>

      <!-- Visual legend -->
      <div class="sidebar-section">
        <div class="section-label">Legend</div>
        <div id="legend-list"></div>
      </div>

      <!-- Search -->
      <div class="sidebar-section">
        <div class="section-label">Search</div>
        <input id="search-input" type="text" placeholder="Search by name...">
        <div id="search-hint"></div>
      </div>

      <!-- View -->
      <div class="sidebar-section">
        <div class="section-label">View</div>
        <button class="ctrl-btn" onclick="resetView()">Fit graph to screen</button>
      </div>

    </aside>

    <!-- ── Canvas ────────────────────────────────────────────────── -->
    <main id="canvas-wrap">
      <div id="graph-canvas"></div>
      <div id="loading-overlay">
        <div id="loading-label">Laying out graph...</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
      </div>
    </main>

    <!-- ── Details panel ─────────────────────────────────────────── -->
    <aside id="details-panel" class="closed">
      <div id="details-header">
        <span id="details-header-label">Node details</span>
        <button id="close-btn" onclick="closeDetails()">Close</button>
      </div>
      <div id="details-body"></div>
    </aside>

  </div>

    const relToB = {};
    GRAPH_DATA.edges.forEach(function (e) {
      if (e.to === GRAPH_DATA.meta.disease_a.id || e.from === GRAPH_DATA.meta.disease_a.id) {
        const entity = e.to === GRAPH_DATA.meta.disease_a.id ? e.from : e.to;
        relToA[entity] = e.relation;
      }
      if (e.to === GRAPH_DATA.meta.disease_b.id || e.from === GRAPH_DATA.meta.disease_b.id) {
        const entity = e.to === GRAPH_DATA.meta.disease_b.id ? e.from : e.to;
        relToB[entity] = e.relation;
      }
    });

    /* ── Entry point ────────────────────────────────────────────────── */
    document.addEventListener("DOMContentLoaded", function () {
      populateSidebar();
      buildGraph();
      attachSearch();
    });

    /* ── Sidebar ────────────────────────────────────────────────────── */
    function populateSidebar() {
      const meta = GRAPH_DATA.meta;
      const da   = meta.disease_a;
      const db   = meta.disease_b;

      /* Header */
      document.getElementById("header-name-a").textContent = da.name;
      document.getElementById("header-name-b").textContent = db.name;

      /* Summary strip */
      document.getElementById("summary-text").textContent = meta.summary;

      /* Shared count badges in summary strip */
      const badgesEl = document.getElementById("shared-badges");
      const typeLabels = { DRG: "Drugs", GEN: "Genes", PHE: "Phenotypes" };
      Object.entries(meta.shared_counts || {}).forEach(function ([type, count]) {
        if (count === 0) return;
        const btn = document.createElement("button");
        btn.className   = "shared-badge";
        btn.textContent = typeLabels[type] + ": " + count;
        btn.onclick     = function () { highlightShared(type, btn); };
        badgesEl.appendChild(btn);
      });

      /* Disease cards */
      document.getElementById("card-name-a").textContent   = da.name;
      document.getElementById("card-id-a").textContent     = da.id;
      document.getElementById("card-counts-a").textContent =
        (meta.shared_counts.DRG || 0) + " shared drugs, "
        + (meta.unique_counts_a.DRG || 0) + " unique";

      document.getElementById("card-name-b").textContent   = db.name;
      document.getElementById("card-id-b").textContent     = db.id;
      document.getElementById("card-counts-b").textContent =
        (meta.shared_counts.DRG || 0) + " shared drugs, "
        + (meta.unique_counts_b.DRG || 0) + " unique";

      /* Shared entity list (clickable rows) */
      const sharedList = document.getElementById("shared-list");
      const typeColors = { DRG: "#534AB7", GEN: "#0F6E56", PHE: "#854F0B" };
      Object.entries(meta.shared_counts || {}).forEach(function ([type, count]) {
        const cfg   = NODE_CONFIG[type] || {};
        const color = typeColors[type] || "#888";
        const row   = document.createElement("div");
        row.className = "shared-row";
        row.innerHTML =
          '<div class="shared-row-left">'
          + '<span class="shared-swatch" style="background:' + color + '"></span>'
          + (cfg.label || type)
          + '</div>'
          + '<span class="shared-row-count">' + count + '</span>';
        row.onclick = function () { highlightShared(type, null); };
        sharedList.appendChild(row);
      });

      /* Status filters (shared / unique_a / unique_b) */
      const statusList = document.getElementById("status-filter-list");
      Object.entries(STATUS_CONFIG).forEach(function ([status, cfg]) {
        statusList.appendChild(makeFilterRow("status", status, cfg.label, null, cfg.color));
      });

      /* Node type filters */
      const typeList = document.getElementById("type-filter-list");
      Object.entries(meta.type_counts || {}).forEach(function ([type, count]) {
        const cfg   = NODE_CONFIG[type] || {};
        const color = cfg.full ? cfg.full.border : "#888";
        typeList.appendChild(makeFilterRow("type", type, cfg.label || type, count, color));
      });

      /* Relationship filters */
      const relList = document.getElementById("relation-filter-list");
      Object.entries(meta.relation_counts || {}).forEach(function ([rel, count]) {
        const cfg = EDGE_CONFIG[rel] || { label: rel, color: "#888" };
        relList.appendChild(makeFilterRow("relation", rel, cfg.label, count, cfg.color));
      });

      /* Legend */
      const legendEl = document.getElementById("legend-list");
      legendEl.innerHTML =
        makeLegendDot("Shared entity",    "#534AB7", "bold, in the centre") +
        makeLegendDot("Unique to Disease A", "#FAECE7", "coral, near left anchor",  "#993C1D") +
        makeLegendDot("Unique to Disease B", "#EDF2FF", "blue, near right anchor",  "#2B55CC") +
        '<div class="legend-row" style="margin-top:8px">' +
          '<div class="legend-line" style="background:#0F6E56"></div>Indication</div>' +
        '<div class="legend-row">' +
          '<div class="legend-line" style="background:#D85A30"></div>Contraindication</div>' +
        '<div class="legend-row">' +
          '<div class="legend-line" style="background:#BA7517"></div>Off-label use</div>' +
        '<div class="legend-row">' +
          '<div class="legend-line" style="background:#534AB7"></div>Associated with</div>';
    }

    function makeLegendDot(label, bg, note, border) {
      border = border || bg;
      return '<div class="legend-row">'
           + '<span class="legend-dot" style="background:' + bg + ';border-color:' + border + '"></span>'
           + label
           + (note ? ' <span style="font-size:10px;color:var(--text-ter)">(' + note + ')</span>' : '')
           + '</div>';
    }

    function makeFilterRow(filterType, key, label, count, swatchColor) {
      const row = document.createElement("div");
      row.className = "filter-row";

      const cb  = document.createElement("input");
      cb.type   = "checkbox";
      cb.checked = true;
      cb.addEventListener("change", function () { applyFilter(filterType, key, cb.checked); });

      const dot = document.createElement("span");
      dot.className        = "filter-swatch";
      dot.style.background = swatchColor;

      const name = document.createElement("span");
      name.className   = "filter-name";
      name.textContent = label;

      row.appendChild(cb);
      row.appendChild(dot);
      row.appendChild(name);

      if (count !== null) {
        const cnt = document.createElement("span");
        cnt.className   = "filter-count";
        cnt.textContent = count;
        row.appendChild(cnt);
      }

      return row;
    }

    /* ── Graph ──────────────────────────────────────────────────────── */
    function buildGraph() {
      const container = document.getElementById("graph-canvas");

      const visNodes = GRAPH_DATA.nodes.map(function (node) {
        const cfg    = NODE_CONFIG[node.type] || {};
        /*
         * Shared entities use the full, saturated color palette.
         * Unique entities use a muted palette so shared ones stand out
         * as the visual focus of the bridge graph.
         */
        const colors = (node.status === "shared" || node.status === "disease")
          ? (cfg.full  || { bg: "#F0EFE8", border: "#888880", font: "#3C3B38" })
          : (cfg.muted || { bg: "#F5F5F2", border: "#C0BEB8", font: "#7A7874" });

        const visNode = {
          id:    node.id,
          label: node.label,
          title: buildTooltip(node),
          shape: "dot",
          size:  node.size,
          color: {
            background: colors.bg,
            border:     colors.border,
            highlight:  { background: colors.bg, border: "#2C2C2A" },
          },
          font: { color: colors.font, size: 11 },
          _type:   node.type,
          _status: node.status,
          _props:  node.props || {},
        };

        /*
         * Disease nodes are pinned at fixed x positions.
         * Everything else is placed by the physics engine.
         * This guarantees the left-right layout: Disease A on the left,
         * Disease B on the right, shared entities naturally in the middle.
         */
        if (node.props && node.props.fixed) {
          visNode.fixed = { x: true, y: true };
          visNode.x = node.props.x;
          visNode.y = node.props.y;
        }

        return visNode;
      });

      const visEdges = GRAPH_DATA.edges.map(function (edge) {
        const cfg = EDGE_CONFIG[edge.relation] || {};
        return {
          id:     edge.id,
          from:   edge.from,
          to:     edge.to,
          label:  cfg.label || edge.relation,
          color:  { color: cfg.color || "#B4B2A9", highlight: "#2C2C2A" },
          width:  1.5,
          smooth: false,
          arrows: { to: { enabled: true, scaleFactor: 0.6 } },
          font:   { size: 9, align: "middle", strokeWidth: 3, strokeColor: "#FAFAF8" },
          _relation: edge.relation,
        };
      });

      allNodes = new vis.DataSet(visNodes);
      allEdges = new vis.DataSet(visEdges);

      const options = {
        nodes:  { shape: "dot" },
        edges:  { color: { inherit: false }, smooth: false },
        physics: {
          forceAtlas2Based: {
            gravitationalConstant: -25,
            centralGravity:        0.005,
            springLength:          200,
            springConstant:        0.04,
            damping:               0.9,
          },
          minVelocity: 0.1,
          maxVelocity: 10,
          solver:      "forceAtlas2Based",
          stabilization: { enabled: true, iterations: 1000, updateInterval: 50 },
          timestep:    0.3,
        },
        interaction: {
          hover:             true,
          tooltipDelay:      150,
          navigationButtons: false,
          keyboard:          false,
        },
      };

      network = new vis.Network(container, { nodes: allNodes, edges: allEdges }, options);

      network.on("stabilizationProgress", function (params) {
        const pct = Math.round((params.iterations / params.total) * 100);
        document.getElementById("loading-label").textContent = "Laying out graph... " + pct + "%";
        document.getElementById("loading-bar").style.width  = pct + "%";
      });

      network.on("stabilizationIterationsDone", function () {
        document.getElementById("loading-overlay").style.display = "none";
        network.fit({ animation: { duration: 500, easingFunction: "easeInOutQuad" } });
      });

      network.on("click", function (params) {
        if (params.nodes.length === 1) {
          showDetails(allNodes.get(params.nodes[0]));
        } else {
          closeDetails();
        }
      });
    }

    function buildTooltip(node) {
      const statusLabel = {
        disease:  "Disease",
        shared:   "Shared by both diseases",
        unique_a: "Unique to " + GRAPH_DATA.meta.disease_a.name,
        unique_b: "Unique to " + GRAPH_DATA.meta.disease_b.name,
      }[node.status] || "";

      const lines = [node.label, statusLabel, "ID: " + node.id];
      if (node.props && node.props.description) {
        const d = node.props.description;
        lines.push("", d.length > 160 ? d.slice(0, 160) + "..." : d);
      }
      return lines.filter(Boolean).join("\n");
    }

    /* ── Details panel ──────────────────────────────────────────────── */
    function showDetails(node) {
      const body   = document.getElementById("details-body");
      const cfg    = NODE_CONFIG[node._type] || {};
      const colors = (node._status === "shared" || node._status === "disease")
        ? (cfg.full  || {})
        : (cfg.muted || {});
      const props  = node._props || {};
      const isShared = node._status === "shared";

      let html = "";

      html += '<span class="detail-badge" style="background:' + (colors.bg || "#F0EFE8")
            + ';color:' + (colors.font || "#333")
            + ';border:1px solid ' + (colors.border || "#888") + '">'
            + (cfg.label || node._type) + "</span>";

      /* Status label */
      const statusText = {
        disease:  "",
        shared:   "Shared by both diseases",
        unique_a: "Unique to " + GRAPH_DATA.meta.disease_a.name,
        unique_b: "Unique to " + GRAPH_DATA.meta.disease_b.name,
      }[node._status] || "";
      if (statusText) {
        html += '<div style="font-size:11px;color:var(--text-ter);margin-bottom:8px">' + esc(statusText) + "</div>";
      }

      html += '<div class="detail-node-name">' + esc(node.label) + "</div>";
      html += '<div class="detail-node-id">'   + esc(node.id)    + "</div>";

      if (props.description) {
        html += '<div class="detail-description">' + esc(props.description) + "</div>";
      }

      /*
       * For shared entities, show the relationship each disease has
       * to this node in a comparison table. This is the key research insight.
       */
      if (isShared && node._status !== "disease") {
        const relA = relToA[node.id];
        const relB = relToB[node.id];
        const relCfgA = EDGE_CONFIG[relA] || { label: relA || "none" };
        const relCfgB = EDGE_CONFIG[relB] || { label: relB || "none" };

        html += '<div class="detail-section-label">Relationship to each disease</div>';
        html += '<table class="compare-table">';
        html += '<tr><th>Disease</th><th>Relationship</th></tr>';
        html += '<tr>'
              + '<td>' + esc(GRAPH_DATA.meta.disease_a.name) + '</td>'
              + '<td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'
              + (EDGE_CONFIG[relA] || {}).color + ';margin-right:6px;vertical-align:middle"></span>'
              + esc(relCfgA.label) + '</td>'
              + '</tr>';
        html += '<tr>'
              + '<td>' + esc(GRAPH_DATA.meta.disease_b.name) + '</td>'
              + '<td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'
              + (EDGE_CONFIG[relB] || {}).color + ';margin-right:6px;vertical-align:middle"></span>'
              + esc(relCfgB.label) + '</td>'
              + '</tr>';
        html += '</table>';
      }

      /* Properties */
      const propRows = Object.entries(props).filter(function ([k, v]) {
        return !["description", "fixed", "x", "y"].includes(k)
            && v !== null && v !== undefined && String(v) !== "";
      });

      if (propRows.length > 0) {
        html += '<div class="detail-section-label">Properties</div><table class="props-table">';
        propRows.forEach(function ([key, val]) {
          const display = Array.isArray(val) ? val.join(", ") : String(val);
          if (display && display !== "null" && display !== "None") {
            html += "<tr>"
                  + '<td class="prop-key">' + esc(key.replace(/_/g, " ")) + "</td>"
                  + '<td class="prop-val">' + esc(display) + "</td>"
                  + "</tr>";
          }
        });
        html += "</table>";
      }

      const extUrl = getExternalUrl(node.id, node._type);
      if (extUrl) {
        html += '<a class="detail-external-link" href="' + extUrl
              + '" target="_blank" rel="noopener">View in external database</a>';
      }

      body.innerHTML = html;
      document.getElementById("details-panel").classList.remove("closed");
    }

    function closeDetails() {
      document.getElementById("details-panel").classList.add("closed");
    }

    /* ── Highlight shared entities ──────────────────────────────────── */
    function highlightShared(type, badgeEl) {
      /* Toggle active class on the clicked badge */
      if (badgeEl) {
        document.querySelectorAll(".shared-badge").forEach(function (b) {
          b.classList.remove("active");
        });
        badgeEl.classList.add("active");
      }

      const ids = [];
      allNodes.forEach(function (n) {
        if (n._type === type && n._status === "shared") ids.push(n.id);
      });

      if (ids.length === 0) return;
      network.selectNodes(ids);
      network.fit({ nodes: ids, animation: { duration: 500, easingFunction: "easeInOutQuad" } });
    }

    /* ── Filters ────────────────────────────────────────────────────── */
    function applyFilter(filterType, key, visible) {
      if (filterType === "status") {
        const updates = [];
        allNodes.forEach(function (n) {
          if (n._status === key) updates.push({ id: n.id, hidden: !visible });
        });
        allNodes.update(updates);
      } else if (filterType === "type") {
        const updates = [];
        allNodes.forEach(function (n) {
          if (n._type === key) updates.push({ id: n.id, hidden: !visible });
        });
        allNodes.update(updates);
      } else if (filterType === "relation") {
        const updates = [];
        allEdges.forEach(function (e) {
          if (e._relation === key) updates.push({ id: e.id, hidden: !visible });
        });
        allEdges.update(updates);
      }
    }

    /* ── Search ─────────────────────────────────────────────────────── */
    function attachSearch() {
      const input = document.getElementById("search-input");
      const hint  = document.getElementById("search-hint");

      input.addEventListener("input", function () {
        const q = this.value.trim().toLowerCase();
        if (!q) { network.unselectAll(); hint.textContent = ""; return; }

        const matches = [];
        allNodes.forEach(function (n) {
          if (!n.hidden && n.label.toLowerCase().includes(q)) matches.push(n.id);
        });

        if (matches.length === 0) {
          hint.textContent = "No match found.";
          network.unselectAll();
          return;
        }

        hint.textContent = matches.length + " match" + (matches.length > 1 ? "es" : "");
        network.selectNodes(matches);
        network.focus(matches[0], { scale: 1.4, animation: { duration: 400 } });
        showDetails(allNodes.get(matches[0]));
      });
    }

    /* ── Utilities ───────────────────────────────────────────────────── */
    function resetView() {
      network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
    }

    function exportPNG() {
      const canvas   = document.querySelector("#graph-canvas canvas");
      if (!canvas) return;
      const filename = GRAPH_DATA.meta.title.replace(/\s+/g, "_") + ".png";
      const link     = document.createElement("a");
      link.download  = filename;
      link.href      = canvas.toDataURL("image/png");
      link.click();
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>

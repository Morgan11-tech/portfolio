<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Graph Explorer</title>

  <!--
    vis-network: the graph rendering library.
    For offline use, download these files and point src/href to local paths.
  -->
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <link  href="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.css" rel="stylesheet">

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ─────────────────────────────────────────────────── */
    :root {
      --bg:           #F8F7F5;
      --surface:      #FFFFFF;
      --border:       #E5E3DC;
      --border-light: #F0EFE8;
      --text:         #1A1A18;
      --text-sec:     #5F5E5A;
      --text-ter:     #9B9A96;
      --accent:       #2B55CC;
      --canvas-bg:    #FAFAF8;
      --sidebar-w:    260px;
      --detail-w:     288px;
      --header-h:     52px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    button, input { font-family: inherit; font-size: 13px; }

    /* ── Header ────────────────────────────────────────────────────────── */
    #app-header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      flex-shrink: 0;
    }

    #app-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    #header-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }

    #disease-label {
      font-size: 12px;
      color: var(--text-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    #header-counts {
      display: flex;
      gap: 5px;
      flex: 1;
      overflow: hidden;
    }

    .count-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--border-light);
      color: var(--text-sec);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    #header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .action-btn {
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text-sec);
      cursor: pointer;
    }
    .action-btn:hover { background: var(--border-light); color: var(--text); }

    /* ── App body ──────────────────────────────────────────────────────── */
    #app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ───────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
    }

    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-ter);
      margin-bottom: 10px;
    }

    /* Disease card */
    #disease-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 3px;
    }

    #disease-id {
      font-size: 10px;
      font-family: monospace;
      color: var(--text-ter);
      margin-bottom: 8px;
    }

    #disease-desc {
      font-size: 12px;
      color: var(--text-sec);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #disease-desc.expanded { display: block; }

    #desc-toggle {
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 0 0;
      display: block;
    }
    #desc-toggle:hover { text-decoration: underline; }

    #disease-external {
      display: inline-block;
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      margin-top: 8px;
    }
    #disease-external:hover { text-decoration: underline; }

    /* Filter rows */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      cursor: pointer;
    }
    .filter-row:last-child { margin-bottom: 0; }

    .filter-row input[type="checkbox"] {
      width: 13px;
      height: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .filter-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .filter-name  { flex: 1; font-size: 12px; color: var(--text-sec); }
    .filter-count { font-size: 11px; color: var(--text-ter); font-variant-numeric: tabular-nums; }

    /* Search */
    #search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      color: var(--text);
      background: var(--canvas-bg);
      outline: none;
    }
    #search-input:focus { border-color: #B4B2A9; }
    #search-input::placeholder { color: var(--text-ter); }

    #search-hint { font-size: 11px; color: var(--text-ter); margin-top: 5px; }

    /* View controls */
    .ctrl-btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--canvas-bg);
      color: var(--text-sec);
      cursor: pointer;
      text-align: left;
    }
    .ctrl-btn:hover { background: var(--border-light); color: var(--text); }
    .ctrl-btn:last-child { margin-bottom: 0; }

    /* ── Graph canvas ──────────────────────────────────────────────────── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--canvas-bg);
    }

    #graph-canvas { width: 100%; height: 100%; }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(250, 250, 248, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 50;
    }

    #loading-label { font-size: 13px; color: var(--text-sec); }

    #loading-bar-wrap {
      width: 180px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: #534AB7;
      border-radius: 2px;
      transition: width 0.1s;
    }

    /* ── Details panel ─────────────────────────────────────────────────── */
    #details-panel {
      width: var(--detail-w);
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.2s ease, border-left-width 0.2s ease;
    }

    #details-panel.closed {
      width: 0;
      border-left-width: 0;
      overflow: hidden;
    }

    #details-panel::-webkit-scrollbar { width: 4px; }
    #details-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #details-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 0;
    }

    #details-header-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-ter);
    }

    #close-btn {
      font-size: 11px;
      color: var(--text-ter);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    #close-btn:hover { color: var(--text); }

    #details-body { padding: 12px 16px 20px; }

    .detail-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .detail-node-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .detail-node-id {
      font-size: 10px;
      font-family: monospace;
      color: var(--text-ter);
      margin-bottom: 10px;
    }

    .detail-description {
      font-size: 12px;
      color: var(--text-sec);
      line-height: 1.6;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-light);
    }

    .detail-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-ter);
      margin: 14px 0 8px;
    }

    .props-table { width: 100%; border-collapse: collapse; }
    .props-table tr { border-bottom: 1px solid var(--border-light); }
    .props-table tr:last-child { border-bottom: none; }
    .props-table td { padding: 5px 0; font-size: 12px; vertical-align: top; }

    .prop-key { color: var(--text-ter); padding-right: 10px; white-space: nowrap; width: 42%; }
    .prop-val { color: var(--text-sec); word-break: break-word; }

    .conn-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    .detail-external-link {
      display: block;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
    }
    .detail-external-link:hover { text-decoration: underline; }
  </style>
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header id="app-header">
    <span id="app-title">Knowledge Graph Explorer</span>
    <div id="header-divider"></div>
    <span id="disease-label">Loading...</span>
    <div id="header-counts"></div>
    <div id="header-actions">
      <button class="action-btn" onclick="resetView()">Fit to screen</button>
      <button class="action-btn" onclick="exportPNG()">Export PNG</button>
    </div>
  </header>

  <!-- ── App body ────────────────────────────────────────────────────── -->
  <div id="app-body">

    <!-- ── Sidebar ─────────────────────────────────────────────────── -->
    <aside id="sidebar">

      <div class="sidebar-section">
        <div class="section-label">Disease</div>
        <div id="disease-name"></div>
        <div id="disease-id"></div>
        <div id="disease-desc"></div>
        <button id="desc-toggle" onclick="toggleDescription()">Read more</button>
        <a id="disease-external" href="#" target="_blank" rel="noopener" style="display:none">
          View in database
        </a>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Node types</div>
        <div id="node-filter-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Relationships</div>
        <div id="edge-filter-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Search</div>
        <input id="search-input" type="text" placeholder="Search by name...">
        <div id="search-hint"></div>
      </div>

      <div class="sidebar-section">
        <div class="section-label">View</div>
        <button class="ctrl-btn" onclick="resetView()">Fit graph to screen</button>
      </div>

    </aside>

    <!-- ── Graph canvas ─────────────────────────────────────────────── -->
    <main id="canvas-wrap">
      <div id="graph-canvas"></div>

      <div id="loading-overlay">
        <div id="loading-label">Laying out graph...</div>
        <div id="loading-bar-wrap">
          <div id="loading-bar"></div>
        </div>
      </div>
    </main>

    <!-- ── Details panel ────────────────────────────────────────────── -->
    <aside id="details-panel" class="closed">
      <div id="details-header">
        <span id="details-header-label">Node details</span>
        <button id="close-btn" onclick="closeDetails()">Close</button>
      </div>
      <div id="details-body"></div>
    </aside>

  </div>

"id": 493, "from": "MONDO_0008903", "to": "ENSG00000007541", "relation": "ASSOCIATED_WITH"}, {"id": 494, "from": "MONDO_0008903", "to": "ENSG00000007545", "relation": "ASSOCIATED_WITH"}, {"id": 495, "from": "MONDO_0008903", "to": "ENSG00000007908", "relation": "ASSOCIATED_WITH"}, {"id": 496, "from": "MONDO_0008903", "to": "ENSG00000007933", "relation": "ASSOCIATED_WITH"}, {"id": 497, "from": "MONDO_0008903", "to": "ENSG00000007944", "relation": "ASSOCIATED_WITH"}, {"id": 498, "from": "MONDO_0008903", "to": "ENSG00000007952", "relation": "ASSOCIATED_WITH"}, {"id": 499, "from": "MONDO_0008903", "to": "ENSG00000007968", "relation": "ASSOCIATED_WITH"}, {"id": 500, "from": "MONDO_0008903", "to": "ENSG00000008018", "relation": "ASSOCIATED_WITH"}, {"id": 501, "from": "MONDO_0008903", "to": "ENSG00000008056", "relation": "ASSOCIATED_WITH"}, {"id": 502, "from": "MONDO_0008903", "to": "ENSG00000008083", "relation": "ASSOCIATED_WITH"}, {"id": 503, "from": "MONDO_0008903", "to": "ENSG00000008130", "relation": "ASSOCIATED_WITH"}, {"id": 504, "from": "MONDO_0008903", "to": "ENSG00000008196", "relation": "ASSOCIATED_WITH"}, {"id": 505, "from": "MONDO_0008903", "to": "ENSG00000008197", "relation": "ASSOCIATED_WITH"}, {"id": 506, "from": "MONDO_0008903", "to": "ENSG00000008226", "relation": "ASSOCIATED_WITH"}, {"id": 507, "from": "MONDO_0008903", "to": "HP_0000006", "relation": "PHENOTYPE_PRESENT"}, {"id": 508, "from": "MONDO_0008903", "to": "HP_0001442", "relation": "PHENOTYPE_PRESENT"}, {"id": 509, "from": "MONDO_0008903", "to": "HP_0006519", "relation": "PHENOTYPE_PRESENT"}, {"id": 510, "from": "MONDO_0008903", "to": "HP_0030078", "relation": "PHENOTYPE_PRESENT"}, {"id": 511, "from": "MONDO_0008903", "to": "HP_0030358", "relation": "PHENOTYPE_PRESENT"}]};


    /* ── Visual configuration ────────────────────────────────────────────
     *
     * Add a new node type by inserting an entry in NODE_CONFIG.
     * Add a new relationship by inserting an entry in EDGE_CONFIG.
     * The rest of the app (filters, graph, details) picks it up
     * automatically because everything is derived from GRAPH_DATA.
     */
    const NODE_CONFIG = {
      DIS: { label: "Disease",   bg: "#FAECE7", border: "#993C1D", font: "#4A1B0C", size: 36 },
      DRG: { label: "Drug",      bg: "#EEEDFE", border: "#534AB7", font: "#26215C", size: 16 },
      GEN: { label: "Gene",      bg: "#E1F5EE", border: "#0F6E56", font: "#04342C", size: 14 },
      PHE: { label: "Phenotype", bg: "#FAEEDA", border: "#854F0B", font: "#412402", size: 13 },
    };

    const EDGE_CONFIG = {
      INDICATION:        { label: "Indication",        color: "#0F6E56" },
      CONTRAINDICATION:  { label: "Contraindication",  color: "#D85A30" },
      OFF_LABEL_USE:     { label: "Off-label use",     color: "#BA7517" },
      ASSOCIATED_WITH:   { label: "Associated with",   color: "#534AB7" },
      PHENOTYPE_PRESENT: { label: "Phenotype present", color: "#854F0B" },
    };

    /* External database links by node type and ID prefix */
    function getExternalUrl(nodeId, nodeType) {
      const curie  = nodeId.replace("_", ":");
      const prefix = nodeId.split("_")[0];

      if (nodeType === "DIS") {
        if (prefix === "MONDO")    return "https://monarchinitiative.org/disease/" + curie;
        if (prefix === "EFO")      return "https://www.ebi.ac.uk/efo/" + nodeId;
        if (prefix === "Orphanet") return "https://www.orpha.net/consor/cgi-bin/OC_Exp.php?lng=EN&Expert=" + nodeId.split("_")[1];
        if (prefix === "OMIM")     return "https://www.omim.org/entry/" + nodeId.split("_")[1];
      }
      if (nodeType === "DRG") {
        if (nodeId.startsWith("DB"))     return "https://go.drugbank.com/drugs/" + nodeId;
        if (nodeId.startsWith("CHEMBL")) return "https://www.ebi.ac.uk/chembl/compound_report_card/" + nodeId;
      }
      if (nodeType === "GEN") return "https://www.ncbi.nlm.nih.gov/gene/?term=" + nodeId;
      if (nodeType === "PHE" && prefix === "HP") return "https://hpo.jax.org/app/browse/term/" + curie;
      return null;
    }


    /* ── State ───────────────────────────────────────────────────────── */
    let network  = null;
    let allNodes = null;
    let allEdges = null;


    /* ── Entry point ─────────────────────────────────────────────────── */
    document.addEventListener("DOMContentLoaded", function () {
      populateSidebar();
      buildGraph();
      attachSearch();
    });


    /* ── Sidebar ─────────────────────────────────────────────────────── */
    function populateSidebar() {
      const meta = GRAPH_DATA.meta;

      document.getElementById("disease-label").textContent = meta.title;
      document.getElementById("disease-name").textContent  = meta.title;
      document.getElementById("disease-id").textContent    = meta.disease_id;

      const desc = meta.description || "";
      document.getElementById("disease-desc").textContent = desc;
      if (desc.length < 120) {
        document.getElementById("desc-toggle").style.display = "none";
      }

      const extUrl = getExternalUrl(meta.disease_id, "DIS");
      if (extUrl) {
        const link   = document.getElementById("disease-external");
        link.href    = extUrl;
        link.style.display = "inline-block";
      }

      /* Header node counts */
      const countsEl = document.getElementById("header-counts");
      Object.entries(meta.counts || {}).forEach(function ([type, count]) {
        if (type === "DIS") return;
        const cfg  = NODE_CONFIG[type] || {};
        const pill = document.createElement("span");
        pill.className   = "count-pill";
        pill.textContent = (cfg.label || type) + ": " + count;
        countsEl.appendChild(pill);
      });

      /* Node type filter list */
      const nodeList = document.getElementById("node-filter-list");
      Object.entries(meta.counts || {}).forEach(function ([type, count]) {
        const cfg = NODE_CONFIG[type] || { label: type, border: "#888" };
        nodeList.appendChild(makeFilterRow("node", type, cfg.label, count, cfg.border));
      });

      /* Relationship filter list */
      const edgeList = document.getElementById("edge-filter-list");
      Object.entries(meta.edge_counts || {}).forEach(function ([relation, count]) {
        const cfg = EDGE_CONFIG[relation] || { label: relation, color: "#888" };
        edgeList.appendChild(makeFilterRow("edge", relation, cfg.label, count, cfg.color));
      });
    }

    function makeFilterRow(filterType, key, label, count, swatchColor) {
      const row = document.createElement("div");
      row.className = "filter-row";

      const cb  = document.createElement("input");
      cb.type   = "checkbox";
      cb.checked = true;
      cb.addEventListener("change", function () {
        applyFilter(filterType, key, cb.checked);
      });

      const dot = document.createElement("span");
      dot.className        = "filter-swatch";
      dot.style.background = swatchColor;

      const name = document.createElement("span");
      name.className   = "filter-name";
      name.textContent = label;

      const cnt = document.createElement("span");
      cnt.className   = "filter-count";
      cnt.textContent = count;

      row.appendChild(cb);
      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(cnt);
      return row;
    }


    /* ── Graph ───────────────────────────────────────────────────────── */
    function buildGraph() {
      const container = document.getElementById("graph-canvas");

      /*
       * Node shape "dot" places the label below the circle, outside it.
       * This keeps node labels readable without cluttering the circle itself.
       * The color and size are set per node from NODE_CONFIG.
       */
      const visNodes = GRAPH_DATA.nodes.map(function (node) {
        const cfg = NODE_CONFIG[node.type] || {};
        return {
          id:    node.id,
          label: node.label,
          title: buildTooltip(node),
          shape: "dot",
          size:  node.size || cfg.size || 16,
          color: {
            background: cfg.bg     || "#F0EFE8",
            border:     cfg.border || "#888880",
            highlight:  { background: cfg.bg || "#F0EFE8", border: "#2C2C2A" },
          },
          font: {
            color: cfg.font || "#3C3B38",
            size:  11,
          },
          _type:  node.type,
          _props: node.props || {},
        };
      });

      /*
       * Edges use straight lines (smooth: false) and carry relation-type
       * colors so researchers can distinguish indication from contraindication
       * at a glance. Arrows show the direction of each relationship.
       */
      const visEdges = GRAPH_DATA.edges.map(function (edge) {
        const cfg = EDGE_CONFIG[edge.relation] || {};
        return {
          id:     edge.id,
          from:   edge.from,
          to:     edge.to,
          label:  cfg.label || edge.relation,
          color:  { color: cfg.color || "#B4B2A9", highlight: "#2C2C2A" },
          width:  1.5,
          smooth: false,
          arrows: { to: { enabled: true, scaleFactor: 0.6 } },
          font:   { size: 9, align: "middle", strokeWidth: 3, strokeColor: "#FAFAF8" },
          _relation: edge.relation,
        };
      });

      allNodes = new vis.DataSet(visNodes);
      allEdges = new vis.DataSet(visEdges);

      /*
       * Physics configuration.
       * forceAtlas2Based is well suited to hub-and-spoke graphs
       * (one central disease with many connected nodes).
       * The graph self-organises and continues to respond to drag
       * interactions after the initial layout pass.
       */
      const options = {
        nodes: {
          shape: "dot",
        },
        edges: {
          color:  { inherit: false },
          smooth: false,
        },
        physics: {
          forceAtlas2Based: {
            gravitationalConstant: -25,
            centralGravity:        0.005,
            springLength:          200,
            springConstant:        0.04,
            damping:               0.9,
          },
          minVelocity: 0.1,
          maxVelocity: 10,
          solver:      "forceAtlas2Based",
          stabilization: {
            enabled:        true,
            iterations:     1000,
            updateInterval: 50,
          },
          timestep: 0.3,
        },
        interaction: {
          hover:             true,
          tooltipDelay:      150,
          navigationButtons: false,
          keyboard:          false,
        },
      };

      network = new vis.Network(
        container,
        { nodes: allNodes, edges: allEdges },
        options
      );

      /* Update progress bar during initial layout */
      network.on("stabilizationProgress", function (params) {
        const pct = Math.round((params.iterations / params.total) * 100);
        document.getElementById("loading-label").textContent = "Laying out graph... " + pct + "%";
        document.getElementById("loading-bar").style.width  = pct + "%";
      });

      /*
       * Once the initial layout pass is done, hide the overlay and fit
       * the graph into view. Physics remains active so the graph continues
       * to self-organise when nodes are dragged or new interactions occur.
       */
      network.on("stabilizationIterationsDone", function () {
        document.getElementById("loading-overlay").style.display = "none";
        network.fit({ animation: { duration: 500, easingFunction: "easeInOutQuad" } });
      });

      /* Click a node to open its details panel */
      network.on("click", function (params) {
        if (params.nodes.length === 1) {
          showDetails(allNodes.get(params.nodes[0]));
        } else {
          closeDetails();
        }
      });
    }

    function buildTooltip(node) {
      /* Plain text tooltip on hover. The details panel carries the full record. */
      const lines = [node.label, "Type: " + node.type, "ID: " + node.id];
      if (node.props && node.props.description) {
        const d = node.props.description;
        lines.push("", d.length > 160 ? d.slice(0, 160) + "..." : d);
      }
      return lines.join("\n");
    }


    /* ── Details panel ───────────────────────────────────────────────── */
    function showDetails(node) {
      const body  = document.getElementById("details-body");
      const cfg   = NODE_CONFIG[node._type] || {};
      const props = node._props || {};

      /* Count edges by relation type for this node */
      const relCounts = {};
      allEdges.get().forEach(function (e) {
        if (e.from === node.id || e.to === node.id) {
          relCounts[e._relation] = (relCounts[e._relation] || 0) + 1;
        }
      });

      let html = "";

      html += '<span class="detail-badge" style="background:' + (cfg.bg || "#F0EFE8")
            + ';color:' + (cfg.font || "#333")
            + ';border:1px solid ' + (cfg.border || "#888") + '">'
            + (cfg.label || node._type) + "</span>";

      html += '<div class="detail-node-name">' + esc(node.label) + "</div>";
      html += '<div class="detail-node-id">'   + esc(node.id)    + "</div>";

      if (props.description) {
        html += '<div class="detail-description">' + esc(props.description) + "</div>";
      }

      /* Properties table — skips description (shown above) and empty values */
      const propRows = Object.entries(props).filter(function ([k, v]) {
        return k !== "description" && v !== null && v !== undefined && String(v) !== "";
      });

      if (propRows.length > 0) {
        html += '<div class="detail-section-label">Properties</div><table class="props-table">';
        propRows.forEach(function ([key, val]) {
          const display = Array.isArray(val) ? val.join(", ") : String(val);
          if (display && display !== "null" && display !== "None") {
            html += "<tr>"
                  + '<td class="prop-key">' + esc(key.replace(/_/g, " ")) + "</td>"
                  + '<td class="prop-val">' + esc(display) + "</td>"
                  + "</tr>";
          }
        });
        html += "</table>";
      }

      /* Connection breakdown */
      if (Object.keys(relCounts).length > 0) {
        html += '<div class="detail-section-label">Connections</div><table class="props-table">';
        Object.entries(relCounts).forEach(function ([rel, count]) {
          const relCfg = EDGE_CONFIG[rel] || { label: rel, color: "#888" };
          html += "<tr>"
                + '<td class="prop-key">'
                + '<span class="conn-dot" style="background:' + relCfg.color + '"></span>'
                + esc(relCfg.label)
                + "</td>"
                + '<td class="prop-val">' + count + "</td>"
                + "</tr>";
        });
        html += "</table>";
      }

      const extUrl = getExternalUrl(node.id, node._type);
      if (extUrl) {
        html += '<a class="detail-external-link" href="' + extUrl
              + '" target="_blank" rel="noopener">View in external database</a>';
      }

      body.innerHTML = html;
      document.getElementById("details-panel").classList.remove("closed");
    }

    function closeDetails() {
      document.getElementById("details-panel").classList.add("closed");
    }


    /* ── Filters ─────────────────────────────────────────────────────── */
    function applyFilter(filterType, key, visible) {
      if (filterType === "node") {
        /*
         * Hiding a node type also suppresses its edges automatically in
         * vis.js — edges to hidden nodes are not rendered. No manual
         * edge update is needed for node type filters.
         */
        const updates = [];
        allNodes.forEach(function (n) {
          if (n._type === key) updates.push({ id: n.id, hidden: !visible });
        });
        allNodes.update(updates);
      } else {
        /* Edge relation filter: hide or show edges by relation type */
        const updates = [];
        allEdges.forEach(function (e) {
          if (e._relation === key) updates.push({ id: e.id, hidden: !visible });
        });
        allEdges.update(updates);
      }
    }


    /* ── Search ──────────────────────────────────────────────────────── */
    function attachSearch() {
      const input = document.getElementById("search-input");
      const hint  = document.getElementById("search-hint");

      input.addEventListener("input", function () {
        const query = this.value.trim().toLowerCase();

        if (!query) {
          network.unselectAll();
          hint.textContent = "";
          return;
        }

        const matches = [];
        allNodes.forEach(function (n) {
          if (!n.hidden && n.label.toLowerCase().includes(query)) matches.push(n.id);
        });

        if (matches.length === 0) {
          hint.textContent = "No match found.";
          network.unselectAll();
          return;
        }

        hint.textContent = matches.length + " match" + (matches.length > 1 ? "es" : "");
        network.selectNodes(matches);
        network.focus(matches[0], {
          scale:     1.4,
          animation: { duration: 400, easingFunction: "easeInOutQuad" },
        });
        showDetails(allNodes.get(matches[0]));
      });
    }


    /* ── Utilities ───────────────────────────────────────────────────── */
    function resetView() {
      network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
    }

    function toggleDescription() {
      const descEl   = document.getElementById("disease-desc");
      const expanded = descEl.classList.toggle("expanded");
      document.getElementById("desc-toggle").textContent = expanded ? "Read less" : "Read more";
    }

    function exportPNG() {
      /* vis.js draws onto a <canvas> element that we can export directly */
      const canvas   = document.querySelector("#graph-canvas canvas");
      if (!canvas) return;
      const filename = (GRAPH_DATA.meta.title || "graph").replace(/\s+/g, "_") + "_graph.png";
      const link     = document.createElement("a");
      link.download  = filename;
      link.href      = canvas.toDataURL("image/png");
      link.click();
    }

    function esc(str) {
      /* Minimal HTML escaping for content set via innerHTML */
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

  </script>
</body>
